<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슈가멍</title>
<style>
  :root {
    --bg: #ffe4ec;
    --card: #ffffff;
    --text: #4a4a4f;
    --accent: #ff7aa8;
    --accent-soft: #ffd0e0;
    --shadow: 0 10px 30px rgba(255, 122, 168, 0.22);
    --shadow-hover: 0 18px 40px rgba(255, 122, 168, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 28px;
    padding: 40px 28px 32px;
    text-align: center;
    box-shadow: var(--shadow);
    transition: transform .3s ease, box-shadow .3s ease;
  }
  .card:hover {
    transform: translateY(-8px);
    box-shadow: var(--shadow-hover);
  }
  .avatar {
    width: 112px;
    height: 112px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffb3cc, var(--accent));
    border: 4px solid var(--accent-soft);
    color: #fff;
    font-size: 44px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  h1 { font-size: 26px; margin-bottom: 10px; }
  .bio { font-size: 15px; line-height: 1.6; word-break: keep-all; margin-bottom: 20px; }
  .tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 26px;
  }
  .tag {
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--text);
    font-size: 14px;
    cursor: default;
    transition: background .2s ease, color .2s ease;
  }
  .tag:hover { background: var(--accent); color: #fff; }
  .links { display: flex; flex-direction: column; gap: 10px; }
  .link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 14px;
    border: 2px solid var(--accent-soft);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    transition: background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .link:hover { background: var(--accent-soft); border-color: var(--accent); transform: scale(1.02); }
  .link svg { width: 20px; height: 20px; flex: none; }
  @media (max-width: 480px) {
    .card { padding: 32px 20px 24px; border-radius: 22px; }
    .avatar { width: 96px; height: 96px; font-size: 38px; }
    h1 { font-size: 23px; }
  }
</style>
</head>
<body>
  <main class="card">
    <!-- 나중에 사진을 넣을 때: <img src="사진경로" alt="슈가멍"> 으로 교체 -->
    <div class="avatar" aria-label="슈가멍 프로필">슈</div>
    <h1>슈가멍</h1>
    <p class="bio">강아지의 스트레스와 안전을 최우선으로 하는 애견 미용샵입니당</p>
    <div class="tags">
      <span class="tag">#귀여운</span>
      <span class="tag">#강아지</span>
    </div>
    <div class="links">
      <a class="link" href="https://blog.naver.com/sugarmung" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        블로그
      </a>
      <a class="link" href="https://www.instagram.com/groomer_mungs?igsh=MXhnczVwcjBkOTZ1&amp;utm_source=qr" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        인스타
      </a>
    </div>
  </main>
</body>
</html>
